name = "lean-plate-connect"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Where the app is hosted (allowed to call this connector).
APP_ORIGIN = "https://cryptonomicon46.github.io/DietApp/"

# Household sharing storage. Create it once with:
#   npx wrangler kv namespace create HOUSEHOLD
# then paste the id it prints below.
[[kv_namespaces]]
binding = "HOUSEHOLD"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Nightly families maintenance check (3:13 am Pacific in summer): repairs half-finished changes
# and writes a report the maintainer sees in Me › Maintainer.
[triggers]
crons = ["13 10 * * *"]
