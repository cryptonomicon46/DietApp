<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OurPawmily">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com https://image.tmdb.org https://*.workers.dev; connect-src 'self' https://*.workers.dev wss://*.workers.dev https://accounts.google.com/gsi/ https://api.open-meteo.com https://air-quality-api.open-meteo.com https://geocoding-api.open-meteo.com https://api.themoviedb.org https://photospicker.googleapis.com https://*.googleusercontent.com; frame-src https://accounts.google.com/gsi/ blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>OurPawmily</title>
  <script src="../theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icon-180.png?v=2">
  <link rel="icon" href="../icon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="../favicon-32.png?v=2" sizes="32x32" type="image/png">
  <meta property="og:title" content="OurPawmily">
  <meta property="og:description" content="Your family, your dogs and your days — together. Private and end-to-end encrypted.">
  <meta property="og:image" content="https://cryptonomicon46.github.io/DietApp/og.png">
  <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css?v=79">
</head>
<body>
  <header class="bar" id="bar" hidden>
    <button type="button" class="fam-switch" id="famSwitch"></button>
    <span class="row"><button type="button" class="chat-top" id="chatTop" data-view="chats" aria-label="Chats" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-4.5 3.5V16.5h0a2 2 0 0 1-2-2z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg><span class="badge" id="chatBadge" hidden></span></button><button type="button" class="help-top" data-act="help" aria-label="Help and the tour">?</button><button type="button" class="icon-btn plus-top" id="newPostTop" aria-label="Create">＋</button>
    <button type="button" class="me-top" id="meTop" data-view="me" aria-label="Me: your account and settings"></button></span>
  </header>
  <div id="lockBanner" class="lockbanner" hidden></div>
  <main id="view" aria-live="polite"></main>
  <nav class="nav" id="nav" hidden>
    <button type="button" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.2 9.6v9.9h11.6V9.6"/><path d="M10 19.5v-5h4v5"/></svg>Home</button>
    <button type="button" data-view="us" class="nav-us"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="heart" d="M12 20.2S4 15.4 4 9.6a4.2 4.2 0 0 1 8-1.9 4.2 4.2 0 0 1 8 1.9c0 5.8-8 10.6-8 10.6z"/></svg><span class="badge" id="usBadge" hidden></span>Us</button>
    <button type="button" data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M7.8 13.2h.4M11.8 13.2h.4M15.8 13.2h.4M7.8 16.8h.4M11.8 16.8h.4" class="thick"/></svg>Calendar</button>
    <button type="button" data-view="threads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10H9.5L5 19.5v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span class="badge" id="famBadge" hidden></span>Threads</button>
    <button type="button" data-view="health" id="navTrackers" aria-label="Health: diet and fitness"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.6c-1.3-1-3-1.4-4.6-.9-2.4.8-3.4 3.2-3 6 .5 3.6 2.8 7.3 5.1 7.3.9 0 1.6-.5 2.5-.5s1.6.5 2.5.5c2.3 0 4.6-3.7 5.1-7.3.4-2.8-.6-5.2-3-6-1.6-.5-3.3-.1-4.6.9z"/><path d="M12 7.6c-.2-2 .7-3.6 2.6-4.3"/><path d="M8.5 13.5h1.6l1-2 1.8 4 1-2h1.6"/></svg>Health</button>
    <button type="button" data-act="help" class="nav-help" aria-label="Help and the tour"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.6" r=".95" class="dot"/></svg>Help</button>
    <button type="button" data-view="me" id="navMe"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.7 3.8-6 7.5-6s6.7 2.3 7.5 6"/></svg>Me</button>
  </nav>
  <dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>
  <div class="toast" id="toast" hidden></div>
  <!-- Fetched alongside app.js, not after api.js asks for it (one round trip less before the first paint). -->
  <link rel="modulepreload" href="../js/server.js">
  <script type="module" src="app.js?v=104"></script>
</body>
</html>
