<body>
  <header class="bar" id="bar" hidden>
    <button type="button" class="fam-switch" id="famSwitch"></button>
    <span class="row"><button type="button" class="icon-btn" id="bingoTop" aria-label="Watch" title="Watch: shows, bingo and picks">🍿</button>
    <button type="button" class="icon-btn" id="newPostTop" aria-label="New post">＋</button></span>
  </header>
  <div id="lockBanner" class="lockbanner" hidden></div>
  <main id="view" aria-live="polite"></main>
  <nav class="nav" id="nav" hidden>
    <button type="button" data-view="feed"><span>🏠</span>Feed</button>
    <button type="button" data-view="pets"><span>🐾</span>Dogs &amp; chores</button>
    <button type="button" data-view="compose" class="nav-post" aria-label="Add something"><span>＋</span></button>
    <button type="button" data-view="calendar"><span>📅</span>Calendar</button>
    <a href="../" class="nav-link" id="navTrackers"><span>🥗</span>Trackers</a>
    <button type="button" data-view="me"><span>👤</span>Me</button>
  </nav>
  <dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js?v=35"></script>
